name: Publish GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Generate and validate both languages
        run: |
          node build-data.mjs
          node validate.mjs
          node --check dist/app.js
          node --check dist/severity.mjs
          node --check translations/en.mjs
          node --check translations/lula.en.mjs
          node --check dist/dossiers.mjs
          node --check dist/case-status.mjs
          node --check dist/lula-severity.mjs
          node --test tests/*.test.mjs
          git diff --exit-code -- dist/data.json dist/data.en.json dist/data.lula.json dist/data.lula.en.json
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
